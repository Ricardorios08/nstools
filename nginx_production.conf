# Configuración para Nginx en Producción

events {
    worker_connections 1024;
}

http {
    # Tipos de archivos (importante para que el CSS/JS se cargue bien)
    include       C:/Fuentes/nginx/conf/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name osep-conversor.local osep-conversor-app osep-conversor-app.local localhost;

        # 1. Servir el Frontend (carpeta dist generada por npm run build)
        location / {
            root "C:/Fuentes/prod/osep-conversor-app/frontend/dist";
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Proxy para el Backend (Node.js en puerto 3007)
        location /api/ {
            proxy_pass http://127.0.0.1:3007/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
        }
    }
}

